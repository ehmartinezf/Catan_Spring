# Connexió a MySQL (equivalent a hibernate.cfg.xml)
spring.datasource.url=jdbc:mysql://localhost:3306/catan_spring?createDatabaseIfNotExist=true
spring.datasource.username=root
spring.datasource.password=super3

# Equivalent a hibernate.hbm2ddl.auto: create mentre fem proves, update quan el model és estable
spring.jpa.hibernate.ddl-auto=create
spring.jpa.show-sql=false

# Evita que la sessió quedi oberta durant la petició HTTP: fora dels @Transactional no hi ha LAZY
spring.jpa.open-in-view=false
